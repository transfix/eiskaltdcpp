schema_version: 1
recipe:
  name: eiskaltdcpp
  upstream_version: "2.6.2"
  cvc_revision: 1
  maintainer: "cy-pca"
  maintainer_url: "https://github.com/transfix/eiskaltdcpp"
  homepage: https://github.com/transfix/eiskaltdcpp
  # COPYING: GPL-3.0-or-later, with the EiskaltDC++ developers' exception permitting linking with
  # OpenSSL. The dcpp core it derives from (DC++) is GPL-2.0-or-later. cvcpkg copies COPYING and
  # LICENSE to share/licenses/eiskaltdcpp/.
  license: GPL-3.0-or-later
  tags: [networking, p2p, direct-connect, daemon, libraries]
  description: >-
    EiskaltDC++ 2.6.2 from the transfix fork, a Direct Connect (NMDC and ADC) client: the
    headless eiskaltdcpp-daemon, controlled over JSON-RPC, and the libeiskaltdcpp core library
    with its development headers (what the eiskaltdcpp-py bindings build against). Built from
    source with Lua scripting, DHT, UPnP (miniupnpc), PCRE2, IDN2 and the fork's NMDCpb
    (protobuf) extension. No GUI. Linux.

# Upstream source: this repository (transfix/eiskaltdcpp, a fork of eiskaltdcpp/eiskaltdcpp), tag
# v2.6.2 (d8d5fe9, 2026-11-17): v2.6.0 plus the daemon stop fix (#6) and the build fixes (#8, #9;
# CryptoManager builds against OpenSSL 4). A recipe cannot pin the commit it is committed in,
# so it pins the tag's commit and moves with each release. The fork's other branches (wip/*,
# nmdcpb-*, qt6-migration, fix/clean-shutdown) are work in progress or merged, and are not
# packaged.
source:
  type: tarball
  url: https://github.com/transfix/eiskaltdcpp/archive/d8d5fe95b527a0dbdd22bb9441c1cfd7428e615c.tar.gz
  sha256: "fb9053012a32354dcc4bf3c343507e7a3e8439112ba7ff16cab8441ec8d04d9f"
  strip_components: 1

patches: []

depends:
  build:
    - cmake
    - ninja
  runtime:
    - name: openssl
    - name: zlib
    - name: bzip2
    - name: protobuf
    - name: abseil
    - name: pcre2
    - name: idn2
    - name: lua
    - name: miniupnpc
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh

package:
  files:
    - bin/eiskaltdcpp-daemon
    - lib/libeiskaltdcpp*
    - lib/pkgconfig/eiskaltdcpp.pc
    - include/eiskaltdcpp/dcpp/
    - include/eiskaltdcpp/extra/
    - include/eiskaltdcpp/dht/
    - include/eiskaltdcpp/proto/
    - share/eiskaltdcpp/build-flags.txt
    - share/locale/
    - share/man/man1/eiskaltdcpp-daemon.1
    - share/licenses/eiskaltdcpp/

test:
  script: test.sh

abi:
  cxx_std: 20

toolchain:
  note: >-
    GCC 12 or newer (C++20), and gettext's msgfmt on PATH: the build compiles the core's message
    catalogues into share/locale/ (Ubuntu's gettext package; glibc provides libintl).

notes:
  - title: "ABI flags the headers depend on"
    description: >-
      Some public classes change layout with build flags: LUA_SCRIPT, WITH_DHT and WITH_NMDCPB
      are all on here. A consumer must compile with all three defined, and with this prefix's
      include/eiskaltdcpp (for proto/nmdcpb.pb.h) and include (protobuf, abseil) on its include
      path, or it will read the wrong offsets. share/eiskaltdcpp/build-flags.txt records them;
      eiskaltdcpp-py's recipe reads it.
  - title: "Data directory is compiled in"
    description: >-
      The core looks for its data directory (bundled Lua scripts, a GeoIP CSV) at a path fixed at
      build time, which points into the build machine once the bundle is installed elsewhere.
      The daemon runs without it, and this build installs neither (the example scripts install
      with the GUI only). Making that path relative to the library is a change for the fork.
  - title: "No GUI yet"
    description: >-
      The fork's Qt 6 GUI (eiskaltdcpp-qt) is not built. qt6 and qtmultimedia are on cvcpkg, so
      it can be a separate recipe (eiskaltdcpp-qt), keeping Qt out of the daemon's closure.
